; Replace `soulteary` / `1000` with the desktop user who shares the screen and its uid (`id -u`),
; and replace `your-user` / `your-strong-password` with your own remote control username and password.
; The file contains the password, keep it readable only by root: `chmod 600`.
;
; urch talks to the desktop session of the user through D-Bus (/run/user/<uid>/bus),
; the session only exists after the user has logged in, urch retries every minute until then.
[program:urch]
command=/usr/local/bin/urch --daemon=1
user=soulteary
environment=HOME="/home/soulteary",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",UBUNTU_REMOTE_USER="your-user",UBUNTU_REMOTE_PASS="your-strong-password"
autostart=true
startsecs=3
startretries=100000
autorestart=true
stderr_logfile=/var/log/urch.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stdout_logfile=/var/log/urch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
