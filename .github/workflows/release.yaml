name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
env:
  GO_VERSION: "1.27.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: |-
          go test -v ./...
        if: "!(github.event_name == 'pull_request')"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          # the config uses the goreleaser v1 schema
          version: "~> v1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pr-reports:
    name: PR Go quality (read only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  report_release:
    name: Dispatch verified release reports
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
